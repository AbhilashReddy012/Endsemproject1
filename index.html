<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Agency Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">DevTeam</div>
    <div class="nav-links">
      <a href="#team">Team</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
    <button id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
  </nav>

  <section class="hero">
    <h1>We Build Cool Stuff 🚀</h1>
    <p>A team of 2 passionate developers turning ideas into reality.</p>
  </section>

  <section id="team" class="section">
    <h2>Meet the Team</h2>
    <div id="teamContainer" class="team-grid">
    </div>
  </section>

  <section id="projects" class="section">
    <h2>Our Projects</h2>
    <div id="projectsContainer" class="projects-grid">
    </div>
  </section>

  <section id="contact" class="section">
    <h2>Contact Us</h2>
    <div class="form-box">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="nameInput" placeholder="Your name" />
        <span class="error" id="nameError"></span>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="emailInput" placeholder="your@email.com" />
        <span class="error" id="emailError"></span>
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea id="messageInput" placeholder="Write your message..."></textarea>
        <span class="error" id="messageError"></span>
      </div>
      <button onclick="submitForm()">Send Message</button>
      <p id="successMsg" class="success"></p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
